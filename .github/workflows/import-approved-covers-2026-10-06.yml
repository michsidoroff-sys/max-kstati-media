name: Import approved covers 2026-10-06
on:
  push:
    branches: [main]
    paths:
      - '.cover-import-trigger-2026-10-06'
permissions:
  contents: write
jobs:
  import-covers:
    if: github.event.head_commit.message == 'Trigger approved cover import for 2026-10-06'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download approved covers
        env:
          URL_0700: 'https://at.adobe.com/5vjJzNKou6rSBlJW'
          URL_1100: 'https://at.adobe.com/bA6yJV3UkZD6j4Mf'
          URL_1500: 'https://at.adobe.com/1mz75CeAZcWLG6aQ'
          URL_1900: 'https://at.adobe.com/FXa9PsyAAWp7jaJH'
        run: |
          set -euo pipefail
          mkdir -p covers/2026-10-06

          download_cover() {
            url="$1"
            slot="$2"
            tmp="covers/2026-10-06/${slot}.tmp"
            curl -fL --retry 2 "$url" -o "$tmp"
            sig8="$(xxd -p -l 8 "$tmp")"
            sig2="$(xxd -p -l 2 "$tmp")"
            if [ "$sig8" = "89504e470d0a1a0a" ]; then
              mv "$tmp" "covers/2026-10-06/${slot}.png"
            elif [ "$sig2" = "ffd8" ]; then
              mv "$tmp" "covers/2026-10-06/${slot}.jpg"
            else
              echo "Unsupported image signature for slot $slot: $sig8"
              exit 1
            fi
          }

          download_cover "$URL_0700" 0700
          download_cover "$URL_1100" 1100
          download_cover "$URL_1500" 1500
          download_cover "$URL_1900" 1900

      - name: Commit covers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers/2026-10-06/
          git commit -m "Add approved covers for 2026-10-06"
          git push origin main
