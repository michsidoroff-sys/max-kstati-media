name: Import approved covers 2026-10-01
on:
  push:
    branches: [main]
    paths:
      - '.cover-import-trigger-2026-10-01'
permissions:
  contents: write
jobs:
  import-covers:
    if: github.event.head_commit.message == 'Trigger approved cover import for 2026-10-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download approved covers
        env:
          URL_0700: 'https://at.adobe.com/DstmhtnR40qVSFsT'
          URL_1100: 'https://at.adobe.com/TxYPe9ivqrN5aO90'
          URL_1500: 'https://at.adobe.com/wjOssVmlncskfpnk'
          URL_1900: 'https://at.adobe.com/EwFpiBj7cLIKpaDb'
        run: |
          set -euo pipefail
          mkdir -p covers/2026-10-01
          curl -fL --retry 2 "$URL_0700" -o covers/2026-10-01/0700.jpg
          curl -fL --retry 2 "$URL_1100" -o covers/2026-10-01/1100.jpg
          curl -fL --retry 2 "$URL_1500" -o covers/2026-10-01/1500.jpg
          curl -fL --retry 2 "$URL_1900" -o covers/2026-10-01/1900.jpg
          for f in covers/2026-10-01/*.jpg; do
            test "$(xxd -p -l 2 "$f")" = "ffd8"
          done
      - name: Commit covers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers/2026-10-01/0700.jpg covers/2026-10-01/1100.jpg covers/2026-10-01/1500.jpg covers/2026-10-01/1900.jpg
          git commit -m "Add approved covers for 2026-10-01"
          git push origin main
