name: Replace approved 1100 cover 2026-10-01
on:
  push:
    branches: [main]
    paths:
      - '.cover-replace-trigger-2026-10-01-1100'
permissions:
  contents: write
jobs:
  replace-cover:
    if: github.event.head_commit.message == 'Trigger approved 1100 cover replacement for 2026-10-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download approved replacement
        env:
          COVER_URL: 'https://at.adobe.com/lrH8zlfWBwAWgigF'
        run: |
          set -euo pipefail
          mkdir -p covers/2026-10-01
          curl -fL --retry 2 "$COVER_URL" -o covers/2026-10-01/1100.jpg
          test "$(xxd -p -l 2 covers/2026-10-01/1100.jpg)" = "ffd8"
      - name: Commit replacement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers/2026-10-01/1100.jpg
          git commit -m "Replace approved 1100 cover for 2026-10-01"
          git push origin main
