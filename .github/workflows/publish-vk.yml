name: Publish to VK

on:
  workflow_dispatch:
    inputs:
      text_file:
        description: "Path to UTF-8 post text file"
        required: true
        default: "vk/posts/example.txt"
        type: string
      image_path:
        description: "Optional repository path to cover image"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Check files/settings only; do not publish"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: kstati-manual-vk
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Publish VK post
        env:
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_API_VERSION: "5.199"
          TEXT_FILE: ${{ inputs.text_file }}
          IMAGE_PATH: ${{ inputs.image_path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python validate_workflow_paths.py
          ARGS=(--text-file "$TEXT_FILE")
          if [ -n "$IMAGE_PATH" ]; then
            ARGS+=(--image "$IMAGE_PATH")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python vk_publish.py "${ARGS[@]}"
