name: Import covers 2026-10-25

on:
  push:
    paths:
      - ".github/workflows/import-covers-2026-10-25.yml"

permissions:
  contents: write

jobs:
  import-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved covers
        run: |
          set -euo pipefail
          mkdir -p /tmp/kstati-covers covers/2026-10-25
          curl -L --fail --retry 3 "https://at.adobe.com/1m40eLV2dBG5VOos" -o /tmp/kstati-covers/0800.png
          curl -L --fail --retry 3 "https://at.adobe.com/0kAu9Pg9FIwliqvd" -o /tmp/kstati-covers/1300.png
          curl -L --fail --retry 3 "https://at.adobe.com/lHiAPapOP6ZLFeQz" -o /tmp/kstati-covers/1800.png
          test "$(stat -c%s /tmp/kstati-covers/0800.png)" -gt 100000
          test "$(stat -c%s /tmp/kstati-covers/1300.png)" -gt 100000
          test "$(stat -c%s /tmp/kstati-covers/1800.png)" -gt 100000

      - name: Normalize to 1920x1080 JPEG
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("/tmp/kstati-covers")
          dst=Path("covers/2026-10-25")
          for slot in ("0800","1300","1800"):
              im=Image.open(src / f"{slot}.png").convert("RGB")
              w,h=im.size
              assert abs(w/h-16/9)<0.03, f"Unexpected aspect ratio: {slot} {im.size}"
              im=im.resize((1920,1080),Image.Resampling.LANCZOS)
              im.save(dst / f"{slot}.jpg","JPEG",quality=95,optimize=True,progressive=True)
              assert Image.open(dst / f"{slot}.jpg").size==(1920,1080)
          PY

      - name: Commit covers and remove one-off workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers/2026-10-25
          git rm .github/workflows/import-covers-2026-10-25.yml
          git commit -m "Add covers for 2026-10-25"
          git push
