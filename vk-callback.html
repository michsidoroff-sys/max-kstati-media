<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK ID callback — КСТАТИ! О ЖИЗНИ</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.5;color:#102a56}
.card{border:1px solid #dbe6f3;border-radius:16px;padding:24px;background:#fff;box-shadow:0 8px 30px rgba(16,42,86,.08)}
h1{margin-top:0} code{word-break:break-all;background:#f3f7fb;padding:2px 6px;border-radius:6px}
.warn{margin-top:18px;padding:12px 14px;border-radius:10px;background:#fff6d8}
</style>
</head>
<body>
<div class="card">
<h1>VK ID — возврат авторизации</h1>
<p>Страница предназначена для технической настройки публикации «КСТАТИ! О ЖИЗНИ».</p>
<div id="result"></div>
<div class="warn"><b>Не отправляйте в чат</b> значения <code>code</code>, <code>access_token</code>, <code>refresh_token</code> и другие секреты.</div>
</div>
<script>
const p = new URLSearchParams(location.search);
const keys = ["code","device_id","state","error","error_description"];
const rows = keys.filter(k=>p.has(k)).map(k=>'<p><b>'+k+':</b> <code>'+String(p.get(k)).replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]))+'</code></p>').join('');
document.getElementById('result').innerHTML = rows || '<p>Параметры авторизации пока не получены.</p>';
</script>
</body>
</html>
